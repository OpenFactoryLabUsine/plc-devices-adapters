[env:opta]
platform = ststm32
board = opta
framework = arduino
lib_deps = arduino-libraries/Arduino_OPC_UA@^0.1.2
check_tool = clangtidy
build_flags = 
    -Uabs
    -std=gnu++14
    -fpermissive
    -Wno-write-strings
    -D_GNU_SOURCE

build_unflags =
    -Dabs
    -DUNITY_INCLUDE_CONFIG_H
build_src_filter = +<*> -<test/>

test_build_src = yes
test_filter = -<main.cpp>

[env:native]
platform = native

[platformio]
description = Adapter for ivac device exposed to OpenFactory through OPC-UA